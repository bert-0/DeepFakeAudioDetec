# Roda a suíte de testes a cada push e em cada pull request.
#
# Existe porque os testes só rodavam quando alguém lembrava de chamar o pytest
# na própria máquina. Dois defeitos reais escaparam assim: um áudio mais curto
# que a janela devolvia zero leituras, e o score aparecia na tela sem dizer em
# que direção ele cresce. Os dois foram encontrados na mão, rodando o programa.
#
# A suíte não precisa da base ASVspoof: todo teste gera o próprio áudio em
# diretório temporário. Por isso ela roda inteira num runner limpo.

name: Testes

# Só o evento de push. O GitHub já associa o run ao pull request aberto a
# partir da branch (o run aparece na aba de checks do PR), então adicionar
# `pull_request:` aqui produziria DOIS runs para o mesmo commit — foi o que
# aconteceu na primeira versão deste arquivo. A exceção seriam PRs vindos de
# forks, que este repositório não usa.
on:
  push:

# Um push novo na mesma branch cancela a execução anterior, que já não interessa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest + ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml      # todo o projeto Python vive aqui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            ml/requirements-dev.txt

      - name: Instala o PyTorch sem CUDA
        # O wheel padrão do PyTorch carrega o runtime CUDA inteiro (~2,5 GB) e
        # o runner não tem GPU. Instalado antes do requirements.txt, ele já
        # satisfaz o `torch>=2.0` de lá e o pip não busca o outro.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Instala as dependências
        run: pip install -r requirements.txt -r requirements-dev.txt ruff

      - name: Erros de código (ruff)
        # Só o que é defeito de verdade: erro de sintaxe, nome indefinido,
        # comparação inválida, import morto. Regras de estilo ficam de fora
        # de propósito — quebrar o CI por ponto e vírgula não ajuda ninguém.
        run: ruff check --select E9,F --output-format=github .

      - name: Testes
        # Da RAIZ do repositório, não de `ml/`. Rodando só de dentro de `ml/`,
        # o CI passava enquanto 14 testes falhavam para quem chamava o pytest
        # da raiz — caminhos relativos como `configs/fusion_v4.yaml` só existem
        # a partir de `ml/`. O conftest agora fixa o diretório; rodar daqui é o
        # que garante que ele continue fixando.
        working-directory: .
        env:
          MPLBACKEND: Agg          # o runner não tem display
          PYTHONHASHSEED: "0"      # torna reprodutível o que depender de hash
        run: pytest ml/tests -q --durations=10
