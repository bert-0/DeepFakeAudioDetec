{% extends "base.html" %}
{% block conteudo %}
<form action="/analisar" method="post" enctype="multipart/form-data" class="cartao" id="form">
  <div class="linha-arquivo oculto" id="linha">
    <span class="nome" id="nome"></span><span class="duracao" id="duracao"></span>
  </div>

  <label class="envio" for="arquivo" id="zona">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <span class="principal">Arraste um arquivo de áudio aqui</span>
    <span class="secundario">ou selecione do seu computador</span>
    <span class="botao-contorno">Selecionar arquivo</span>
    <input type="file" id="arquivo" name="arquivo" required class="visualmente-oculto"
           accept="{{ extensoes | join(',') }}">
  </label>

  <div class="centro oculto" id="analisando">
    <div class="veredito">Analisando voz…</div>
    <div class="legenda">Isso pode levar alguns segundos.</div>
  </div>

  <div class="acoes" id="acoes">
    <label for="arquivo" id="trocar" class="oculto">Trocar arquivo</label>
    <button type="submit" class="verde">Analisar</button>
  </div>
  <div class="nota">Formatos aceitos: WAV · MP3 · M4A · FLAC · OGG · até 25 MB.
    O arquivo é apagado depois da análise; só o resultado fica guardado.</div>
</form>
{% endblock %}
{% block scripts %}
<script>
(function () {
  var form = document.getElementById("form"), input = document.getElementById("arquivo"),
      zona = document.getElementById("zona"), linha = document.getElementById("linha"),
      nome = document.getElementById("nome"), duracao = document.getElementById("duracao"),
      trocar = document.getElementById("trocar");

  var acoes = document.getElementById("acoes");
  acoes.classList.add("oculto");   // sem JavaScript, o botão fica sempre visível

  function mmss(s) { s = Math.round(s); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }

  function mostrar(arquivo) {
    nome.textContent = arquivo.name;
    duracao.textContent = "";
    var audio = new Audio(URL.createObjectURL(arquivo));
    audio.addEventListener("loadedmetadata", function () {
      if (isFinite(audio.duration)) duracao.textContent = mmss(audio.duration);
    });
    linha.classList.remove("oculto"); trocar.classList.remove("oculto"); zona.classList.add("oculto");
    acoes.classList.remove("oculto");
  }

  input.addEventListener("change", function () { if (input.files.length) mostrar(input.files[0]); });
  ["dragenter", "dragover"].forEach(function (ev) {
    zona.addEventListener(ev, function (e) { e.preventDefault(); zona.classList.add("arrastando"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    zona.addEventListener(ev, function (e) { e.preventDefault(); zona.classList.remove("arrastando"); });
  });
  zona.addEventListener("drop", function (e) {
    if (e.dataTransfer.files.length) { input.files = e.dataTransfer.files; mostrar(input.files[0]); }
  });
  form.addEventListener("submit", function () {
    zona.classList.add("oculto");
    document.getElementById("analisando").classList.remove("oculto");
    acoes.classList.add("oculto");
  });
})();
</script>
{% endblock %}
